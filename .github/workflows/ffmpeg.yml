name: ffmpeg

# Builds Grably's minimal LGPL ffmpeg whenever its build script changes, and runs it through Grably's own export
# path on Windows, so a broken build or a missing codec, format or filter shows up in the pull request rather than at
# release time. The build is kept as an artifact for a week.
on:
  pull_request:
    paths: ['tools/ffmpeg/**', '.github/workflows/ffmpeg.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b
    steps:
      - uses: actions/checkout@v4

      - name: Build ffmpeg
        run: bash tools/ffmpeg/build.sh "$GITHUB_WORKSPACE/ffmpeg-out"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: src/Grably.App/ffmpeg

      - name: Build grably-dev
        run: dotnet build tools/Grably.DevCli/Grably.DevCli.csproj --configuration Release

      # The same check as in the release workflow.
      - name: Check the minimal ffmpeg
        run: |
          $env:GRABLY_HOME = Join-Path $env:RUNNER_TEMP 'grably-home'
          $cli = 'tools/Grably.DevCli/bin/Release/net10.0-windows10.0.26100.0/grably-dev.exe'
          & $cli export --sample --keep 1-3,5-7 --format gif
          if ($LASTEXITCODE) { throw 'The GIF export failed with the minimal ffmpeg' }
          & $cli encoders
          & $cli export --sample --keep 1-3 --format mp4
          if ($LASTEXITCODE) { Write-Output '::warning::The MP4 export could not be checked here (no H.264 encoder works on this runner)' }
          exit 0
