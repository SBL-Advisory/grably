name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Grably.slnx

      - name: Build
        run: dotnet build Grably.slnx --configuration Release --no-restore -warnaserror

      # Tests tagged Category=Desktop need an interactive desktop session (capture, input, devices), which hosted
      # runners do not have; run them locally.
      - name: Test
        run: dotnet test --solution Grably.slnx --configuration Release --no-build --filter-not-trait "Category=Desktop"
